repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: mix-test
        name: 'elixir test'
        entry: mix test
        language: system
        pass_filenames: false
        files: \.exs*$

      - id: mix-format
        name: 'elixir format'
        entry: mix format --check-formatted
        language: system
        files: \.exs*$

      - id: mix-dialyzer
        name: 'elixir dialyzer'
        entry: mix dialyzer
        language: system
        pass_filenames: false
        files: '(\.exs?$|^mix\.lock$)'

      - id: mix-credo
        name: 'elixir credo'
        entry: mix credo
        language: system
        pass_filenames: false
        files: '(\.exs?$|^mix\.lock$)'

      - id: mix-sobelow
        name: 'elixir security analysis'
        entry: mix sobelow
        language: system
        pass_filenames: false
        files: '(\.exs?$|^mix\.lock$)'

      - id: mix-bench
        name: 'elixir benchmark'
        entry: mix bench
        language: system
        pass_filenames: false
        files: '(\.exs?$|^mix\.lock$)'

      - id: mix-sbom-cyclonedx
        name: 'elixir CycloneDX SBoM'
        entry: mix sbom.cyclonedx --force --output _build/bom.cdx.json
        language: system
        pass_filenames: false
        files: '(\.exs?$|^mix\.lock$)'

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
