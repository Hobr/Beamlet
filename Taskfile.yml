# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  fmt:
    desc: Format Go code and organize imports (modifies files)
    cmds:
      - golangci-lint fmt
      - goreleaser check
      - prek run --all-files

  lint:
    desc: Run Go static analysis and error checks
    cmds:
      - golangci-lint run

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  check:
    desc: Run lint and tests without modifying files
    cmds:
      - task: lint
      - task: test

  vuln:
    desc: Check for known vulnerabilities
    cmds:
      - govulncheck ./...

  update:
    desc: Update Go module dependencies, tidy module files, then update global Go tools
    cmds:
      - go get -u ./...
      - go mod tidy
      - task: update-tools
      - prek autoupdate
      - nix flake update

  update-tools:
    desc: Update all globally installed Go tools
    preconditions:
      - sh: command -v gup
        msg: 'gup not found in PATH; run task install-dev and ensure GOBIN is in PATH'
    cmds:
      - gup update

  licenses:
    desc: Generate the dependency's licenses
    cmds:
      - go-licenses check --include_tests ./...
      - go-licenses report --include_tests ./... > licenses.csv
      - go-licenses save ./... --save_path=third_party_licenses

  install-dev:
    desc: Install Go development tools
    cmds:
      - for:
          - golang.org/x/tools/gopls
          - golang.org/x/vuln/cmd/govulncheck
          - github.com/maruel/panicparse/v2/cmd/pp
          - github.com/go-delve/delve/cmd/dlv
          - github.com/google/go-licenses/v2
          - github.com/nao1215/gup
          - github.com/goreleaser/goreleaser/v2
        cmd: go install {{.ITEM}}@latest
