# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  fmt:
    desc: Format Go code and organize imports (modifies files)
    cmds:
      - goimports -w .
      - prek run --all-files

  lint:
    desc: Run Go static analysis and error checks
    cmds:
      - go vet ./...
      - golangci-lint run
      - staticcheck ./...
      - errcheck ./...

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  check:
    desc: Run lint and tests without modifying files
    cmds:
      - task: lint
      - task: test

  vuln:
    desc: Check for known vulnerabilities
    cmds:
      - govulncheck ./...

  update:
    desc: Update Go module dependencies, tidy module files, then update global Go tools
    cmds:
      - go get -u ./...
      - go mod tidy
      - task: update-tools
      - prek autoupdate
      - nix flake update

  update-tools:
    desc: Update all globally installed Go tools
    preconditions:
      - sh: command -v gup
        msg: 'gup not found in PATH; run task install-dev and ensure GOBIN is in PATH'
    cmds:
      - gup update

  install-dev:
    desc: Install Go development tools
    cmds:
      - for:
          - golang.org/x/tools/gopls
          - golang.org/x/tools/cmd/goimports
          - golang.org/x/tools/cmd/callgraph
          - golang.org/x/tools/cmd/digraph
          - golang.org/x/tools/cmd/stringer
          - golang.org/x/tools/cmd/toolstash
          - golang.org/x/vuln/cmd/govulncheck
          - honnef.co/go/tools/cmd/staticcheck
          - go.uber.org/nilaway/cmd/nilaway
          - github.com/kisielk/errcheck
          - github.com/maruel/panicparse/v2/cmd/pp
          - github.com/go-delve/delve/cmd/dlv
          - github.com/nao1215/gup
        cmd: go install {{.ITEM}}@latest
