version: "2"

linters:
  enable:
    # General correctness and conventions.
    - revive
    - errorlint
    - nilerr
    - nolintlint
    - gocritic

    # Zap and OpenTelemetry.
    - loggercheck
    - spancheck

    # HTTP calls and IPv6-safe endpoint construction.
    - bodyclose
    - noctx
    - nosprintfhostport

    # SQL resources, queries, and protocol contracts.
    - sqlclosecheck
    - rowserrcheck
    - unqueryvet
    - exhaustive
    - musttag

    # Host operations and worker lifecycle.
    - gosec
    - fatcontext
    - durationcheck

    # Test helpers and deliberate parallelism.
    - thelper
    - usetesting
    - tparallel

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    nolintlint:
      require-specific: true
      require-explanation: true

    spancheck:
      checks:
        - end

    musttag:
      functions:
        - name: github.com/goccy/go-json.Marshal
          tag: json
          arg-pos: 0
        - name: github.com/goccy/go-json.Unmarshal
          tag: json
          arg-pos: 1

formatters:
  enable:
    - goimports
    - gofumpt
