[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/store-sqlite",
    "crates/transport-zenoh",

    "crates/harness",
    "crates/llm",
    "crates/tools",

    "apps/cli"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/Hobr/Beamlet"

[workspace.dependencies]
beamlet-kernel = { path = "crates/kernel" }
beamlet-store-sqlite = { path = "crates/store-sqlite" }
beamlet-transport-zenoh = { path = "crates/transport-zenoh" }

beamlet-harness = { path = "crates/harness" }
beamlet-llm = { path = "crates/llm" }
beamlet-tools = { path = "crates/tools" }
