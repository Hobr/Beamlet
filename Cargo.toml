[workspace]
resolver = "3"
members = [
    "apps/console",
    "apps/node",

    "apps/ui",
    "apps/web",
    "apps/desktop",
    "apps/mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/Hobr/Beamlet"

[workspace.dependencies]
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
task-supervisor = "0.5"

dioxus = "0.7"
lucide-dioxus = { version = "3.63", features = ["all-icons"] }
beamlet-ui = { path = "apps/ui" }

tower = "0.5"
tower-http = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

ron = "0.12"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "2"
