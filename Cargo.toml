[workspace]
resolver = "3"
members = [
  "kernel/beamlet",
  "kernel/beamlet-durable",
  "kernel/beamlet-kernel",

  "adapters/beamlet-message-nats",
  "adapters/beamlet-message-zenoh",

  "agent/beamlet-agent",
  "agent/beamlet-agent-llm",
  "agent/beamlet-agent-tool",

  "app/beamlet-console",
  "app/beamlet-node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
readme = "README.md"
homepage = "https://github.com/Everfold/Beamlet"
repository = "https://github.com/Everfold/Beamlet"
license = "Apache-2.0"

[workspace.dependencies]
beamlet = { path = "kernel/beamlet" }
beamlet-durable = { path = "kernel/beamlet-durable" }
beamlet-kernel = { path = "kernel/beamlet-kernel" }

beamlet-agent = { path = "agent/beamlet-agent" }
beamlet-agent-llm = { path = "agent/beamlet-agent-llm" }
beamlet-agent-tool = { path = "agent/beamlet-agent-tool" }

beamlet-message-nats = { path = "adapters/beamlet-message-nats" }
beamlet-message-zenoh = { path = "adapters/beamlet-message-zenoh" }

futures = "0.3"
rayon = "1.12"
tokio = { version = "1.54", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

async-nats = "0.51"
zenoh = { version = "1.10", features = ["shared-memory", "stats"] }

axum = { version = "0.8", features = ["http2", "ws"] }
tower = "0.5"
tower-http = "0.7"

wasmtime = "50"
wasmtime-wasi = "50"

reqwest = { version = "0.13", features = ["brotli", "cookies", "deflate", "gzip", "json", "socks", "stream", "zstd"] }
rquickjs = { version = "0.14", features = ["full"] }
rune = "0.14"

config = "0.15"
diesel = { version = "2.3", features = ["sqlite"] }
tempfile = "3.27"

blake3 = { version = "1.8", features = ["rayon"] }
chrono = "0.4"
uuid = { version = "1.29", features = ["serde", "v4", "v5", "v7"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4.6", features = ["derive", "string", "unicode"] }
reedline = { version = "0.52", features = ["bashisms", "sqlite", "system_clipboard"] }
tachyonfx = "0.25"

foundations = "5.11"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = "0.33"
opentelemetry-stdout = "0.33"
tracing = "0.1"
tracing-appender = "0.2"
tracing-error = "0.2"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "2"

criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.12"

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = true
codegen-units = 1
