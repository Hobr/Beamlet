[workspace]
resolver = "3"
members = [
  "apps/console",
  "apps/node",

  "apps/desktop",
  "apps/mobile",
  "apps/ui",
  "apps/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/Hobr/Beamlet"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.54", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

kameo = { version = "0.22", features = ["metrics", "remote"] }
rmqtt = { version = "0.24", features = ["full"] }

axum = { version = "0.8", features = ["http2", "ws"] }
reqwest = { version = "0.13", features = ["brotli", "cookies", "deflate", "gzip", "json", "socks", "stream", "zstd"] }
tower = "0.5"
tower-http = "0.7"

rayon = "1.12"
wasmtime = "50"
wasmtime-wasi = "50"

config = "0.15"
sea-orm = { version = "2", features = ["macros", "runtime-tokio", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-uuid"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

beamlet-ui = { path = "apps/ui" }
dioxus = "0.7"
lucide-dioxus = { version = "3.63", features = ["all-icons"] }

tracing = "0.1"
tracing-appender = "0.2"
tracing-error = "0.2"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "2"
